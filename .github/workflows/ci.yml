name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/mai_test
      TEST_APP_URL: postgresql://mai_app:apppass@localhost:5432/mai_test
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/mai_test
      # Application web (E2E) : APP_ENV=dev, boîte d'envoi de test activée, aucun secret réel.
      APP_ENV: dev
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://mai_app:apppass@localhost:5432/mai_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-1234
      KEK_BASE64: Y2ktb25seS1rZWstY2ktb25seS1rZWstY2ktb25seTE=
      HASH_PEPPER: ci-only-pepper-ci-only-pepper-ci-only-1234
      HIBP_ENABLED: "false"
      E2E_OUTBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Générer le client Prisma
        run: pnpm db:generate
      - name: Appliquer les migrations
        run: pnpm db:migrate
      - name: Activer le rôle applicatif (test)
        run: psql "$TEST_ADMIN_URL" -c "ALTER ROLE mai_app LOGIN PASSWORD 'apppass'"
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build de l'application
        run: pnpm --filter @mon-agent-ia/web build
      - name: Installer Chromium
        run: pnpm --filter @mon-agent-ia/web exec playwright install --with-deps chromium
      - name: Tests E2E
        run: pnpm --filter @mon-agent-ia/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - name: Audit des dépendances
        run: pnpm audit --prod --audit-level=high
